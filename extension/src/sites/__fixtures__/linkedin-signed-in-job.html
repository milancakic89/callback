<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>(3) Senior Software Developer | JetBrains | LinkedIn</title>
</head>
<body>
<!-- WRITTEN BY HAND, not saved from a live page: the signed-in LinkedIn job page can't be fetched without an
     account. It follows the structure the page is known to have (2024-2025): the job pane's top card
     (`job-details-jobs-unified-top-card__*`), whose title is a link to the job, and the apply button in
     `jobs-s-apply`. The same pane is the right-hand side of /jobs/search/ and /jobs/collections/. -->
<header id="global-nav">
<nav aria-label="Primary">
<a href="https://www.linkedin.com/jobs/?" class="global-nav__primary-link">Jobs</a>
<a href="https://www.linkedin.com/notifications/" class="global-nav__primary-link">Notifications</a>
</nav>
</header>
<main>
<div class="jobs-search__job-details--container">
<div class="job-view-layout jobs-details">
<div class="job-details-jobs-unified-top-card__container--two-pane">
<div class="display-flex align-items-center">
<a class="ember-view job-details-jobs-unified-top-card__company-logo" href="https://www.linkedin.com/company/jetbrains/life/">
<img alt="JetBrains" class="evi-image" src="">
</a>
<div class="job-details-jobs-unified-top-card__company-name">
<a class="app-aware-link" href="https://www.linkedin.com/company/jetbrains/life/">
JetBrains
</a>
</div>
</div>
<div class="t-24 job-details-jobs-unified-top-card__job-title">
<h1 class="t-24 t-bold inline">
<a class="ember-view" href="/jobs/view/4463907148/?alternateChannel=search&amp;refId=abc">Senior Software Developer (JCP Core Foundation Licensing and Quotation)</a>
</h1>
</div>
<div class="job-details-jobs-unified-top-card__primary-description-container">
<div class="t-black--light mb2">
<span class="tvm__text tvm__text--low-emphasis">Belgrade, Serbia</span>
<span class="tvm__text tvm__text--low-emphasis"> · </span>
<span class="tvm__text tvm__text--low-emphasis"><strong>12 hours ago</strong></span>
<span class="tvm__text tvm__text--low-emphasis"> · </span>
<span class="tvm__text tvm__text--low-emphasis">45 applicants</span>
</div>
</div>
<div class="mt4">
<div class="display-flex">
<div class="jobs-apply-button--top-card">
<button aria-label="Easy Apply to Senior Software Developer at JetBrains" class="jobs-apply-button artdeco-button artdeco-button--3 artdeco-button--primary ember-view" type="button">
<span class="artdeco-button__text">Easy Apply</span>
</button>
</div>
<button aria-label="Save the job" class="jobs-save-button artdeco-button artdeco-button--secondary artdeco-button--3" type="button">
<span class="artdeco-button__text">Save</span>
</button>
</div>
</div>
</div>
</div>
</div>
</main>
</body>
</html>
